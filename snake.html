<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub - Snake</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050711;
    color:white;
    user-select:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:radial-gradient(circle at 50% 50%, #17234b 0%, #080b18 45%, #03040b 100%);
    display:flex;
    align-items:center;
    justify-content:center;
}

#game::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
        linear-gradient(#ffffff08 1px, transparent 1px),
        linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size:45px 45px;
}

#hud{
    position:absolute;
    z-index:50;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:25px;
    padding:12px 20px;
    border:1px solid #ffffff1c;
    border-radius:14px;
    background:#080c1ce8;
    backdrop-filter:blur(12px);
    font-weight:900;
}

.stat{
    color:#8e99b8;
}

.stat span{
    color:white;
}

#score{ color:#ffe45c; }
#best{ color:#47e0a7; }

#exitTop{
    position:absolute;
    z-index:50;
    top:18px;
    left:18px;
    padding:10px 16px;
    border-radius:10px;
    border:1px solid #ffffff1c;
    background:#080c1ce8;
    color:#8e99b8;
    text-decoration:none;
    font-weight:900;
    font-size:13px;
}

#exitTop:hover{
    color:white;
    border-color:#42eaff88;
}

canvas{
    position:relative;
    z-index:5;
    border-radius:14px;
    box-shadow:0 0 40px #000a, 0 0 0 1px #42eaff33;
    background:#0a0e1f;
}

.overlay{
    position:absolute;
    inset:0;
    z-index:80;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#03040bcc;
    backdrop-filter:blur(6px);
}

.overlay.hidden{
    display:none;
}

.panel{
    background:#0d0f20;
    border:1px solid #42eaff44;
    border-radius:18px;
    padding:34px 40px;
    text-align:center;
    max-width:340px;
    box-shadow:0 0 60px #000c;
}

.panel h1{
    font-size:26px;
    margin-bottom:10px;
}

.panel p{
    color:#a9b3d4;
    margin-bottom:18px;
    line-height:1.6;
}

.panel button{
    display:block;
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:none;
    font-weight:900;
    font-size:14px;
    cursor:pointer;
}

#startButton, #restartButton{
    background:linear-gradient(90deg,#42eaff,#5c55ff);
    color:#020212;
}

.exit{
    background:#ffffff10;
    color:#c8d0ee;
    border:1px solid #ffffff22 !important;
}

.exit:hover{
    background:#ffffff1c;
}
</style>
</head>
<body>

<div id="game">

    <a href="index.html" id="exitTop">🚪 EXIT</a>

    <div id="hud">
        <div class="stat">SCORE <span id="score">0</span></div>
        <div class="stat">BEST <span id="best">0</span></div>
    </div>

    <canvas id="canvas" width="480" height="480"></canvas>

    <!-- START -->

    <div class="overlay" id="startScreen">

        <div class="panel">

            <h1>🐍 SNAKE</h1>

            <p>
                Управляй змейкой стрелками или WASD.
                Собирай еду, расти, не врезайся в стены
                и в себя.
            </p>

            <button id="startButton">▶ ИГРАТЬ</button>

            <button class="exit" id="exitStart">🚪 EXIT</button>

        </div>

    </div>

    <!-- GAME OVER -->

    <div class="overlay hidden" id="gameOver">

        <div class="panel">

            <h1>💀 GAME OVER</h1>

            <p id="finalText"></p>

            <button id="restartButton">🔄 RESTART</button>

            <button class="exit" id="exitGame">🚪 EXIT</button>

        </div>

    </div>

</div>


<script src="gamehub-bridge.js"></script>
<script>
"use strict";

/* =========================
   ELEMENTS
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");
const finalText = document.getElementById("finalText");


/* =========================
   CONFIG
========================= */

const GRID = 24;
const CELLS = canvas.width / GRID;

let best =
    Number(localStorage.getItem("snakeBest") || 0);

bestEl.textContent = best;

let snake, dir, nextDir, food, score, tickTimer, playing;


/* =========================
   INIT
========================= */

function resetGame(){

    snake = [
        { x: 10, y: 12 },
        { x: 9,  y: 12 },
        { x: 8,  y: 12 }
    ];

    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };

    score = 0;
    scoreEl.textContent = score;

    placeFood();

    playing = true;

}

function placeFood(){

    let ok = false;

    while(!ok){

        food = {
            x: Math.floor(Math.random() * CELLS),
            y: Math.floor(Math.random() * CELLS)
        };

        ok = !snake.some(s => s.x === food.x && s.y === food.y);

    }

}


/* =========================
   LOOP
========================= */

function step(){

    if(!playing)
        return;

    dir = nextDir;

    const head = {
        x: snake[0].x + dir.x,
        y: snake[0].y + dir.y
    };

    if(
        head.x < 0 || head.x >= CELLS ||
        head.y < 0 || head.y >= CELLS ||
        snake.some(s => s.x === head.x && s.y === head.y)
    ){

        return endGame();

    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){

        score++;
        scoreEl.textContent = score;
        placeFood();

    }else{

        snake.pop();

    }

    draw();

}

function draw(){

    ctx.fillStyle = "#0a0e1f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#ffffff08";

    for(let i=1; i<CELLS; i++){

        ctx.beginPath();
        ctx.moveTo(i*GRID, 0);
        ctx.lineTo(i*GRID, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i*GRID);
        ctx.lineTo(canvas.width, i*GRID);
        ctx.stroke();

    }

    ctx.fillStyle = "#ff5c8a";
    ctx.shadowColor = "#ff5c8a";
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(
        food.x*GRID + GRID/2,
        food.y*GRID + GRID/2,
        GRID/2 - 3,
        0, Math.PI*2
    );
    ctx.fill();
    ctx.shadowBlur = 0;

    snake.forEach((s,i) => {

        const t = i === 0 ? 1 : 0.55;

        ctx.fillStyle =
            i === 0
                ? "#42eaff"
                : `rgba(94,224,167,${t})`;

        ctx.shadowColor = "#42eaff";
        ctx.shadowBlur = i === 0 ? 12 : 0;

        ctx.fillRect(
            s.x*GRID + 2,
            s.y*GRID + 2,
            GRID - 4,
            GRID - 4
        );

        ctx.shadowBlur = 0;

    });

}


/* =========================
   GAME OVER
========================= */

function endGame(){

    playing = false;

    if(score > best){

        best = score;

        localStorage.setItem("snakeBest", best);

        bestEl.textContent = best;

    }

    finalText.innerHTML =
        `Счёт: <b>${score}</b><br>Лучший: <b>${best}</b>`;

    if(window.GameHub)
        GameHub.reportScore("snake", score);

    gameOverScreen.classList.remove("hidden");

}


/* =========================
   CONTROLS
========================= */

document.addEventListener("keydown", e => {

    const key = e.key.toLowerCase();

    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key))
        e.preventDefault();

    if((key === "arrowup" || key === "w") && dir.y === 0)
        nextDir = { x:0, y:-1 };

    if((key === "arrowdown" || key === "s") && dir.y === 0)
        nextDir = { x:0, y:1 };

    if((key === "arrowleft" || key === "a") && dir.x === 0)
        nextDir = { x:-1, y:0 };

    if((key === "arrowright" || key === "d") && dir.x === 0)
        nextDir = { x:1, y:0 };

});

/* swipe controls for touch */

let touchStart = null;

canvas.addEventListener("touchstart", e => {

    touchStart = {
        x: e.touches[0].clientX,
        y: e.touches[0].clientY
    };

}, { passive:true });

canvas.addEventListener("touchend", e => {

    if(!touchStart)
        return;

    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;

    if(Math.abs(dx) > Math.abs(dy)){

        if(dx > 20 && dir.x === 0) nextDir = { x:1, y:0 };
        if(dx < -20 && dir.x === 0) nextDir = { x:-1, y:0 };

    }else{

        if(dy > 20 && dir.y === 0) nextDir = { x:0, y:1 };
        if(dy < -20 && dir.y === 0) nextDir = { x:0, y:-1 };

    }

    touchStart = null;

}, { passive:true });


/* =========================
   START / RESTART
========================= */

function startRun(){

    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");

    resetGame();
    draw();

    clearInterval(tickTimer);
    tickTimer = setInterval(step, 110);

}

document.getElementById("startButton").onclick = startRun;
document.getElementById("restartButton").onclick = startRun;

document.getElementById("exitStart").onclick =
    () => location.href = "index.html";

document.getElementById("exitGame").onclick =
    () => location.href = "index.html";

</script>
</body>
</html>
